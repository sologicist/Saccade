# Platform-session and business contracts. No live Dext, LLM keys or secrets.
name: Saccade CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: saccade-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install UI route test prerequisites
        run: python -m pip install 'flask>=3.1.3' 'Pillow>=12.3.0' 'google-genai>=1.64.0' 'python-dotenv>=1.2.4'
      - name: Python unit and platform session contracts
        run: python -m unittest discover -s tests -t . -q

  javascript:
    name: JavaScript contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Platform observer and automatic Web UI contracts
        run: >-
          node --test
          AutoCua/web/browser/AutoCuaBridge/platform_scope.test.cjs
          AutoCua/ui/platform_session/auto_lite.test.mjs
      - name: Install UI dependencies from lockfile
        working-directory: AutoCua/ui
        run: npm ci
      - name: Typecheck UI source
        working-directory: AutoCua/ui
        run: npm run typecheck
      - name: Verify shipping UI bundle matches source
        working-directory: AutoCua/ui
        run: |
          npm run build
          git diff --exit-code -- index.js

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install Google SDK for native schema validation
        if: runner.os == 'Windows'
        run: python -m pip install 'google-genai>=1.64.0' 'python-dotenv>=1.2.4'
      - name: Rust unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SACCADE_TEST_PYTHON = (Get-Command python).Source
          cargo test --locked --manifest-path AutoCua/web/Cargo.toml

      - name: Rust compilation check (Linux)
        if: runner.os == 'Linux'
        run: cargo check --locked --all-targets --manifest-path AutoCua/web/Cargo.toml
      - name: Build PyO3 extension for native contracts
        if: runner.os == 'Windows'
        run: cargo build --locked --manifest-path AutoCua/web/Cargo.toml
      - name: Native Python / Rust integration contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Resolve-Path 'AutoCua/web/target/debug/agent_native.dll'
          $env:SACCADE_TEST_NATIVE = $dll.Path
          python -m unittest tests.test_platform_session_native -v
      - name: Build and inspect a fresh Python wheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install 'maturin>=1.15,<2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          maturin build --locked --profile dev --out .cache/ci-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          maturin sdist --out .cache/ci-sdist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SACCADE_TEST_WHEEL = (Get-ChildItem .cache/ci-wheels/*.whl | Select-Object -First 1).FullName
          $env:SACCADE_TEST_SDIST = (Get-ChildItem .cache/ci-sdist/*.tar.gz | Select-Object -First 1).FullName
          python -m unittest tests.test_packaging -v
